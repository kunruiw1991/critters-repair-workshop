<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Critter Repair">
<meta name="theme-color" content="#efe2cc">
<title>Critter Repair Workshop</title>
<style>
:root{
  --ivory:#FFFDF7; --ink:#3d3346; --soft:#8c8295; --wood:#efe2cc; --wood2:#e2cfb1;
  --accent:#7b6bd6; --accent2:#ece8fb; --mint:#8fd3b9; --gold:#f2c14e; --card:#fffdf7;
  --shadow:0 2px 0 rgba(90,64,40,.07),0 8px 24px rgba(90,64,40,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Quicksand",system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 50% -10%,#fbf4e8 0%,var(--wood) 55%,var(--wood2) 100%);
  min-height:100%;
}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px 6px}
.brand{font-weight:800;font-size:20px;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
.brand .dot{width:34px;height:34px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);font-size:18px}
.brand small{display:block;font-weight:600;font-size:12px;color:var(--soft)}
.ctrls{display:flex;gap:8px}
.btn{border:none;background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:15px;
  padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);cursor:pointer;transition:transform .25s ease,background .25s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;box-shadow:none;color:var(--soft)}
.btn[disabled]{opacity:.45;pointer-events:none}
.hidden{display:none!important}

/* ---------- Home ---------- */
#home{max-width:980px;margin:0 auto;padding:18px 22px 40px;text-align:center}
#home h1{font-size:clamp(28px,4.4vw,44px);margin:18px 0 6px;font-weight:900;letter-spacing:.3px}
#home p.lead{margin:0 auto 28px;max-width:560px;color:var(--soft);font-size:17px;line-height:1.5}
.cards{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin-bottom:30px}
.pick{width:210px;background:var(--card);border-radius:28px;padding:18px 16px 16px;box-shadow:var(--shadow);cursor:pointer;
  border:3px solid transparent;transition:transform .35s ease,border-color .35s}
.pick:hover{transform:translateY(-3px)}
.pick.sel{border-color:var(--accent)}
.pick img{width:150px;height:150px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 12px;background:var(--ivory);filter:grayscale(.35) sepia(.25) brightness(.93)}
.pick.sel img{filter:none}
.pick b{display:block;font-size:19px}
.pick span{display:block;color:var(--soft);font-size:14px;margin-top:2px}
.pick .stars{height:20px;margin-top:6px;font-size:14px;color:#c99a1d}
.howto{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px auto 26px;max-width:640px}
.howto i{font-style:normal;width:46px;height:46px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:22px;box-shadow:var(--shadow)}
.startbtn{font-size:20px;padding:15px 38px}

/* ---------- Game ---------- */
#game{padding:4px 18px 24px}
.steps{display:flex;gap:10px;justify-content:center;margin:4px 0 14px}
.chip{width:42px;height:42px;border-radius:50%;background:rgba(255,253,247,.55);display:grid;place-items:center;font-size:20px;position:relative;transition:all .5s ease;opacity:.6}
.chip.now{background:var(--card);opacity:1;transform:scale(1.18);box-shadow:0 0 0 3px var(--accent),var(--shadow)}
.chip.done{background:var(--card);opacity:1}
.chip.done::after{content:"✓";position:absolute;right:-3px;bottom:-3px;width:18px;height:18px;border-radius:50%;background:var(--mint);color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center}
.bench{display:flex;gap:26px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.stage{position:relative;height:min(74vh,112vw);aspect-ratio:3/4;border-radius:34px;overflow:hidden;background:var(--ivory);
  box-shadow:0 0 0 10px rgba(255,253,247,.6),var(--shadow);touch-action:none}
.stage canvas{width:100%;height:100%;display:block;cursor:none;touch-action:none}
#cursor{position:absolute;left:0;top:0;pointer-events:none;font-size:64px;line-height:1;transform:translate(-50%,-50%);
  filter:drop-shadow(0 4px 6px rgba(60,40,30,.25));transition:opacity .3s;opacity:0;z-index:3}
.btneye{border-radius:50%;background:radial-gradient(circle at 35% 32%,#fff 0 13%,#20182a 15% 100%);box-shadow:0 0 0 4px #2a2233,0 4px 8px rgba(0,0,0,.25)}
.veil{position:absolute;inset:0;background:rgba(255,253,247,.82);display:grid;place-items:center;text-align:center;z-index:5;backdrop-filter:blur(3px)}
.veil h2{margin:0 0 14px;font-size:30px}
.panel{width:300px;max-width:100%;display:flex;flex-direction:column;gap:16px}
.hint{background:var(--card);border-radius:26px;padding:18px 18px 16px;box-shadow:var(--shadow)}
.hint .ico{font-size:40px;line-height:1}
.hint h3{margin:8px 0 4px;font-size:21px}
.hint p{margin:0;color:var(--soft);font-size:16px;line-height:1.45;min-height:46px}
.hint .say{margin-top:10px;font-size:14px;padding:8px 12px}
.meter{height:14px;border-radius:999px;background:rgba(255,253,247,.7);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
.meter div{height:100%;width:0;background:linear-gradient(90deg,var(--mint),#b8e6d4);border-radius:999px;transition:width .6s ease}
.tray{background:var(--card);border-radius:26px;padding:18px;box-shadow:var(--shadow);display:flex;gap:12px;justify-content:center;flex-wrap:wrap;min-height:120px;align-items:center}
.tool{width:92px;height:92px;border-radius:26px;background:var(--accent2);display:grid;place-items:center;font-size:50px;border:3px solid transparent;cursor:pointer;transition:transform .3s ease,border-color .3s}
.tool.sel{border-color:var(--accent)}
.tool:active{transform:scale(.94)}
.tool.big{width:120px;height:120px;font-size:66px;animation:breathe 2.6s ease-in-out infinite}
.tool .btneye{width:52px;height:52px}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.tray .done{flex-basis:100%;margin-top:4px}

/* ---------- Finale card ---------- */
.card{background:var(--card);border-radius:30px;padding:26px 26px 22px;box-shadow:var(--shadow);max-width:520px;width:92%}
.card h2{margin:0 0 6px;font-size:28px}
.card p{margin:0 0 16px;color:var(--soft);font-size:17px;line-height:1.45}
.ba{display:flex;gap:14px;justify-content:center;margin-bottom:18px}
.ba figure{margin:0;flex:1}
.ba img{width:100%;border-radius:18px;background:var(--ivory);box-shadow:0 0 0 4px #f3ecde}
.ba figcaption{font-size:13px;font-weight:800;color:var(--soft);margin-top:6px;letter-spacing:.6px;text-transform:uppercase}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
@media (max-width:760px){.panel{width:100%}.stage{height:auto;width:100%}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="dot">🧵</div><div>Critter Repair Workshop<small>Fix up our family critters</small></div></div>
  <div class="ctrls">
    <button class="btn hidden" id="pauseBtn">⏸ Pause</button>
    <button class="btn hidden" id="stopBtn">⏹ Stop</button>
    <button class="btn" id="soundBtn" title="Sound">🔊</button>
  </div>
</header>

<!-- Home -->
<section id="home">
  <h1>Critter Repair Workshop</h1>
  <p class="lead">Our critters had a big, muddy adventure. Pick a friend, then brush, wash, stuff, stitch and shine them until they smile again.</p>
  <div class="cards" id="cards"></div>
  <div class="howto" aria-hidden="true"><i>🧹</i><i>🧽</i><i>💨</i><i>☁️</i><i>🪡</i><i>🔘</i><i>✨</i><i>🎀</i></div>
  <button class="btn primary startbtn" id="startBtn">▶ Start</button>
</section>

<!-- Game -->
<section id="game" class="hidden">
  <div class="steps" id="steps"></div>
  <div class="bench">
    <div class="stage" id="stage">
      <canvas id="cv" width="896" height="1200"></canvas>
      <div id="cursor"></div>
      <div class="veil hidden" id="pauseVeil"><div><h2>Taking a little rest</h2><button class="btn primary" id="resumeBtn">▶ Resume</button></div></div>
      <div class="veil hidden" id="endVeil"></div>
    </div>
    <aside class="panel">
      <div class="hint">
        <div class="ico" id="hintIco">🧹</div>
        <h3 id="hintTitle">Brush off the dust</h3>
        <p id="hintText"></p>
        <button class="btn say" id="sayBtn">🔈 Say it</button>
      </div>
      <div class="meter"><div id="meter"></div></div>
      <div class="tray" id="tray"></div>
    </aside>
  </div>
</section>

<script>
(() => {
'use strict';
const W = 896, H = 1200, CX = 448, BY = 1110;

/* ---------------- Family critters (1 critter = 1 canonical art) ---------------- */
const CRITTERS = {
  lunabat: {
    name: 'LunaBat', who: 'Chuyu', img: 'critters/lunabat.jpg', icon: 'icons/critter_01_lunabat.jpg',
    eye: {x: 531, y: 468, r: 64}, pendant: {x: 446, y: 772, r: 54}, pendantName: 'moon and star',
    tear: [[506, 818], [548, 962]], thread: '#c9a8f2',
    thanks: 'Yay! My wings are soft and shiny again. Thank you, Chuyu!'
  },
  sunnyfox: {
    name: 'SunnyFox', who: 'Mom', img: 'critters/sunnyfox.jpg', icon: 'icons/critter_02_sunnyfox.jpg',
    eye: {x: 362, y: 408, r: 50}, pendant: {x: 446, y: 744, r: 60}, pendantName: 'golden lantern',
    tear: [[504, 758], [556, 928]], thread: '#f07c78',
    thanks: 'My lantern is glowing bright! Thank you for taking care of Mommy, Chuyu!'
  },
  poppydash: {
    name: 'PoppyDash', who: 'Dad', img: 'critters/poppydash.jpg', icon: 'icons/critter_03_poppydash.jpg',
    eye: {x: 562, y: 402, r: 62}, pendant: {x: 448, y: 764, r: 56}, pendantName: 'popcorn bucket',
    tear: [[506, 808], [546, 936]], thread: '#f2c14e',
    thanks: 'Fluffy again! Ready to run and eat popcorn. Thanks, Chuyu!'
  }
};

const STEPS = [
  {id: 'dust',   icon: '🧹', title: 'Brush off the dust', hint: 'Brush away all the dusty fluff.', tool: '🧹'},
  {id: 'wash',   icon: '🧽', title: 'Bubble bath',        hint: 'Scrub-a-dub! Wash off the mud.', tool: '🧽'},
  {id: 'dry',    icon: '💨', title: 'Blow dry',           hint: 'Hold and move the dryer over the water drops.', tool: '💨'},
  {id: 'stuff',  icon: '☁️', title: 'Fluffy stuffing',    hint: 'Tap the cotton to make me fluffy again.', tool: null},
  {id: 'stitch', icon: '🪡', title: 'Stitch the tear',    hint: 'Tap the glowing dots, one by one, to sew me up.', tool: '🪡'},
  {id: 'eye',    icon: '🔘', title: 'Sew on an eye',      hint: 'Put the button eye back in its place.', tool: 'eye'},
  {id: 'polish', icon: '✨', title: 'Shine the pendant',  hint: '', tool: '🧤'},
  {id: 'gift',   icon: '🎀', title: 'A little gift',      hint: 'Pick a gift, then tap to put it on.', tool: null}
];

/* ---------------- DOM ---------------- */
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const cursorEl = $('cursor');

/* ---------------- State ---------------- */
let sel = 'lunabat', C = null, stepIdx = 0, paused = false, running = false;
let soundOn = true, down = false, lastPt = null;
let base = null, bgCol = '#FAF6E8', maskCv, critterCv, grimeCv, dustCv, filmCv, tearCv, socketCv;
let fx = {};           // fading alphas
let initCount = {}, drops = [], stitches = [], stitchPts = [], stickers = [];
let stuff = 0, sq = {sy: .8, sx: 1.07, wob: 0}, parts = [], gift = null, celebrate = false;
let beforeShot = null, lastCheck = 0, stepLocked = false, eyeDone = false, heartTimer = 0;
const shelf = JSON.parse(localStorage.getItem('critterRepairShelf') || '{}');

/* ---------------- Audio (soft ASMR) ---------------- */
let ac = null, noiseBuf = null, dryerNode = null;
function audio() {
  if (!ac) {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return null;
    ac = new A();
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function noise(freq, q, gain, dur, type = 'bandpass') {
  if (!soundOn || !audio()) return;
  const s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ac.createGain(); const t = ac.currentTime;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + dur * .3); g.gain.linearRampToValueAtTime(0, t + dur);
  s.connect(f).connect(g).connect(ac.destination); s.start(t, Math.random() * .5); s.stop(t + dur + .05);
}
function tone(f1, f2, dur, gain = .06, type = 'sine', delay = 0) {
  if (!soundOn || !audio()) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + delay;
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .05);
}
const chime = (notes, gap = .16, gain = .05) => notes.forEach((n, i) => tone(n, n * 1.001, 1.1, gain, 'sine', i * gap));
function dryer(on) {
  if (!soundOn || !audio()) return;
  if (on && !dryerNode) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 650;
    const g = ac.createGain(); g.gain.setValueAtTime(0, ac.currentTime); g.gain.linearRampToValueAtTime(.05, ac.currentTime + .3);
    s.connect(f).connect(g).connect(ac.destination); s.start(); dryerNode = {s, g};
  } else if (!on && dryerNode) {
    const {s, g} = dryerNode; g.gain.linearRampToValueAtTime(0, ac.currentTime + .25); s.stop(ac.currentTime + .3); dryerNode = null;
  }
}
let lastSfx = 0;
function sfxRub(kind) {
  const now = performance.now(); if (now - lastSfx < 130) return; lastSfx = now;
  if (kind === 'dust') noise(2400, .8, .045, .14);
  else if (kind === 'wash') { noise(900, 1.2, .05, .16); if (Math.random() < .35) tone(520 + Math.random() * 300, 900, .09, .035); }
  else if (kind === 'polish') { noise(4200, 2, .03, .1); if (Math.random() < .25) tone(1760, 2100, .2, .02); }
}
function speak(text) {
  if (!soundOn || !('speechSynthesis' in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.rate = .88; u.pitch = 1.15; u.lang = 'en-US';
  speechSynthesis.speak(u);
}

/* ---------------- Helpers ---------------- */
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; };
const rnd = (a, b) => a + Math.random() * (b - a);
let maskData = null, bbox = null;
const inMask = (x, y) => { x |= 0; y |= 0; return x >= 0 && y >= 0 && x < W && y < H && maskData[y * W + x] === 1; };
function randMaskPt(pad = 0) {
  for (let i = 0; i < 400; i++) {
    const x = rnd(bbox.x0 + pad, bbox.x1 - pad), y = rnd(bbox.y0 + pad, bbox.y1 - pad);
    if (inMask(x, y) && inMask(x - pad, y) && inMask(x + pad, y) && inMask(x, y - pad) && inMask(x, y + pad)) return [x, y];
  }
  return [CX, 760];
}
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }

/* Flood-fill the flat background from the borders to get a clean critter mask. */
function buildMask(img) {
  const c = mk(), x = c.getContext('2d'); x.drawImage(img, 0, 0, W, H);
  const id = x.getImageData(0, 0, W, H), d = id.data;
  const corners = [[4, 4], [W - 5, 4], [4, H - 5], [W - 5, H - 5]];
  let br = 0, bgc = 0, bb = 0;
  corners.forEach(([cx, cy]) => { const i = (cy * W + cx) * 4; br += d[i]; bgc += d[i + 1]; bb += d[i + 2]; });
  br /= 4; bgc /= 4; bb /= 4; bgCol = `rgb(${br | 0},${bgc | 0},${bb | 0})`;
  const isBg = p => { const i = p * 4; return Math.abs(d[i] - br) + Math.abs(d[i + 1] - bgc) + Math.abs(d[i + 2] - bb) < 30; };
  const bgm = new Uint8Array(W * H), st = new Int32Array(W * H); let sp = 0;
  const push = p => { if (!bgm[p] && isBg(p)) { bgm[p] = 1; st[sp++] = p; } };
  for (let i = 0; i < W; i++) { push(i); push((H - 1) * W + i); }
  for (let j = 0; j < H; j++) { push(j * W); push(j * W + W - 1); }
  while (sp) {
    const p = st[--sp], px = p % W;
    if (px > 0) push(p - 1); if (px < W - 1) push(p + 1);
    if (p >= W) push(p - W); if (p < W * (H - 1)) push(p + W);
  }
  maskData = new Uint8Array(W * H); bbox = {x0: W, y0: H, x1: 0, y1: 0};
  const m = x.createImageData(W, H);
  for (let p = 0; p < W * H; p++) {
    if (!bgm[p]) {
      maskData[p] = 1; m.data[p * 4 + 3] = 255; m.data[p * 4] = m.data[p * 4 + 1] = m.data[p * 4 + 2] = 255;
      const px = p % W, py = (p / W) | 0;
      if (px < bbox.x0) bbox.x0 = px; if (px > bbox.x1) bbox.x1 = px; if (py < bbox.y0) bbox.y0 = py; if (py > bbox.y1) bbox.y1 = py;
    }
  }
  maskCv = mk(); maskCv.getContext('2d').putImageData(m, 0, 0);
  critterCv = mk(); const cc = critterCv.getContext('2d');
  cc.drawImage(img, 0, 0, W, H); cc.globalCompositeOperation = 'destination-in'; cc.drawImage(maskCv, 0, 0);
  return d;
}
function clipToMask(c) { const g = c.getContext('2d'); g.globalCompositeOperation = 'destination-in'; g.drawImage(maskCv, 0, 0); g.globalCompositeOperation = 'source-over'; }

/* ---------------- Damage layers ---------------- */
function makeDust() {
  dustCv = mk(); const g = dustCv.getContext('2d');
  for (let i = 0; i < 1100; i++) {
    const [x, y] = randMaskPt(); g.fillStyle = `rgba(${150 + rnd(0, 40) | 0},${146 + rnd(0, 36) | 0},${138 + rnd(0, 30) | 0},${rnd(.5, .9)})`;
    g.beginPath(); g.arc(x, y, rnd(1.5, 4.5), 0, 7); g.fill();
  }
  for (let k = 0; k < 16; k++) {                    // fluffy dust bunnies
    const [x, y] = randMaskPt(20);
    for (let i = 0; i < 12; i++) {
      g.fillStyle = `rgba(${205 + rnd(0, 25) | 0},${200 + rnd(0, 22) | 0},${190 + rnd(0, 20) | 0},.92)`;
      g.beginPath(); g.arc(x + rnd(-26, 26), y + rnd(-18, 18), rnd(7, 15), 0, 7); g.fill();
    }
  }
  g.strokeStyle = 'rgba(235,232,226,.85)'; g.lineWidth = 2;   // two soft cobwebs
  [[bbox.x0 + 150, bbox.y0 + 170], [bbox.x1 - 170, bbox.y1 - 210]].forEach(([x, y]) => {
    for (let a = 0; a < 8; a++) { g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a * .785) * 90, y + Math.sin(a * .785) * 90); g.stroke(); }
    for (let r = 25; r <= 90; r += 22) { g.beginPath(); for (let a = 0; a <= 8; a++) { const px = x + Math.cos(a * .785) * r, py = y + Math.sin(a * .785) * r; a ? g.lineTo(px, py) : g.moveTo(px, py); } g.stroke(); }
  });
  clipToMask(dustCv);
}
function makeGrime() {
  grimeCv = mk(); const g = grimeCv.getContext('2d');
  g.drawImage(critterCv, 0, 0);
  const id = g.getImageData(0, 0, W, H), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    if (!d[i + 3]) continue;
    const l = (d[i] * .3 + d[i + 1] * .59 + d[i + 2] * .11);
    d[i] = (d[i] * .35 + l * .25 + 118 * .4) * .86;
    d[i + 1] = (d[i + 1] * .35 + l * .25 + 96 * .4) * .86;
    d[i + 2] = (d[i + 2] * .35 + l * .25 + 72 * .4) * .86;
  }
  g.putImageData(id, 0, 0);
  for (let k = 0; k < 11; k++) {                    // mud splotches
    const [x, y] = randMaskPt(), r = rnd(45, 110);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(96,66,40,.8)'); gr.addColorStop(.6, 'rgba(110,78,48,.55)'); gr.addColorStop(1, 'rgba(110,78,48,0)');
    g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, r, r * rnd(.6, 1), rnd(0, 3), 0, 7); g.fill();
  }
  clipToMask(grimeCv);
}
function makeFilm() {

  parts.forEach(p => {
    const a = p.life ? Math.max(0, Math.min(1, Math.min(p.t / 20, (p.life - p.t) / 30))) : 1;
    if (p.k === 'spark' && p.t > 0) { g.fillStyle = `rgba(255,214,102,${a})`; star4(g, p.x, p.y, 10 + 8 * Math.sin(p.t / p.life * Math.PI)); }
    if (p.k === 'ring') { g.strokeStyle = `rgba(255,214,102,${1 - p.t / p.life})`; g.lineWidth = 5; g.beginPath(); g.arc(p.x, p.y, p.r + p.t * .9, 0, 7); g.stroke(); }
    if (p.k === 'bubble') { g.strokeStyle = `rgba(150,190,235,${a * .9})`; g.fillStyle = `rgba(230,244,255,${a * .45})`; g.lineWidth = 2.5; g.beginPath(); g.arc(p.x, p.y, p.r + p.t * .04, 0, 7); g.fill(); g.stroke(); g.fillStyle = `rgba(255,255,255,${a})`; g.beginPath(); g.arc(p.x - p.r * .35, p.y - p.r * .35, p.r * .18, 0, 7); g.fill(); }
    if (p.k === 'heart') { g.globalAlpha = a; g.font = '54px serif'; g.textAlign = 'center'; g.fillText('💗', p.x, p.y); g.globalAlpha = 1; }
    if (p.k === 'wind') { g.strokeStyle = `rgba(255,255,255,${a * .8})`; g.lineWidth = 4; g.lineCap = 'round'; g.beginPath(); g.moveTo(p.x, p.y); g.quadraticCurveTo(p.x + 25, p.y - 10, p.x + 50, p.y); g.stroke(); }
    if (p.k === 'puff' && p.cx !== undefined) { g.fillStyle = '#fffefb'; g.strokeStyle = '#e4ddd0'; g.lineWidth = 3; [[0, 0, 26], [-22, 8, 18], [22, 8, 18], [0, -16, 18]].forEach(([dx, dy, r]) => { g.beginPath(); g.arc(p.cx + dx, p.cy + dy, r, 0, 7); g.fill(); g.stroke(); }); }
  });
}
function loop(t) {
  if (running && !paused) update();
  if (running) render(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------------- Home ---------------- */
function renderCards() {
  $('cards').innerHTML = Object.entries(CRITTERS).map(([k, c]) => `
    <div class="pick ${k === sel ? 'sel' : ''}" data-k="${k}">
      <img src="${c.icon}" alt="${c.name}"><b>${c.name}</b><span>${c.who}</span>
      <div class="stars">${shelf[k] ? '★'.repeat(Math.min(5, shelf[k])) : ''}</div></div>`).join('');
  document.querySelectorAll('.pick').forEach(el => el.onclick = () => { sel = el.dataset.k; tone(600, 760, .12, .035); renderCards(); });
}
renderCards();
$('startBtn').onclick = startGame;
$('stopBtn').onclick = stopGame;
$('pauseBtn').onclick = () => setPaused(!paused);
$('resumeBtn').onclick = () => setPaused(false);
$('sayBtn').onclick = () => speak($('hintText').textContent);
$('soundBtn').onclick = () => { soundOn = !soundOn; $('soundBtn').textContent = soundOn ? '🔊' : '🔈'; if (!soundOn) { dryer(false); if ('speechSynthesis' in window) speechSynthesis.cancel(); } };
window.addEventListener('resize', () => { if (C && STEPS[stepIdx] && STEPS[stepIdx].tool === 'eye') setCursor('eye'); });

/* Test hooks for automated verification. */
const api = {
  get step() { return STEPS[stepIdx].id; }, get stuff() { return stuff; }, get drops() { return drops.length; },
  get stitches() { return stitches.length; }, get celebrate() { return celebrate; },
  stitchPts: () => stitchPts, dropPts: () => drops.map(d => [CX + (d.x - CX) * sq.sx, BY + (d.y - BY) * sq.sy]), eye: () => C.eye, pendant: () => C.pendant, remaining: k => countAlpha(k === 'dust' ? dustCv : k === 'wash' ? grimeCv : filmCv) / initCount[k]
};
})();
