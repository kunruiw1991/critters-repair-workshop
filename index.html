<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Critter Repair 3D">
<meta name="theme-color" content="#2a2233">
<title>Critter Repair Workshop 3D</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="gl"></canvas>

<!-- Top bar -->
<header id="top">
  <div class="brand"><span class="logo">🧵</span><div><b>Critter Repair Workshop</b><small>Fix-it clinic for our family critters</small></div></div>
  <div class="right">
    <div class="pill" id="starPill">⭐ <span id="stars">0</span></div>
    <button class="round" id="musicBtn" title="Music">🎵</button>
    <button class="round" id="soundBtn" title="Sounds &amp; voice">🔊</button>
    <button class="round hidden" id="pauseBtn" title="Pause">⏸</button>
    <button class="round hidden" id="stopBtn" title="Stop">⏹</button>
  </div>
</header>

<!-- Home -->
<section id="home" class="overlay">
  <div class="homecard glass">
    <h1>Who needs fixing today?</h1>
    <p>Our critters came home from a big adventure, all muddy, dusty and torn. Pick a friend and fix them in <b>any order you like</b>.</p>
    <div class="patients" id="patients"></div>
    <button class="cta" id="startBtn">▶ Start repairing</button>
  </div>
</section>

<!-- In-game HUD -->
<aside id="ticket" class="glass hidden">
  <div class="tk-head"><img id="tkIcon" alt=""><div><b id="tkName"></b><small id="tkWho"></small></div></div>
  <div class="tk-title">Repair ticket</div>
  <div id="chips"></div>
  <div class="heart-meter"><span>💗</span><div class="bar"><div id="heartFill"></div></div></div>
  <div class="tk-tip">Tap a ticket item to find it.</div>
</aside>

<div id="turn" class="hidden">
  <button class="round" id="rotL" title="Turn left">⟲</button>
  <button class="round" id="zoomBtn" title="Zoom">🔍</button>
  <button class="round" id="rotR" title="Turn right">⟳</button>
</div>

<nav id="toolbox" class="hidden"><div class="drawer" id="tools"></div></nav>

<nav id="dress" class="hidden">
  <div class="drawer">
    <div class="dress-title">Pick a present</div>
    <div class="row" id="dressItems"></div>
    <button class="cta small" id="shelfBtn">🏠 Go to the Happy Shelf</button>
  </div>
</nav>

<div id="bubble" class="hidden"></div>
<div id="cursor"></div>
<div id="toast" class="hidden"></div>

<section id="pauseVeil" class="overlay hidden"><div class="glass homecard small"><h1>Taking a little rest</h1><button class="cta" id="resumeBtn">▶ Resume</button></div></section>
<section id="endVeil" class="overlay hidden"></section>

<script src="js/vendor/three.min.js"></script>
<script type="module" src="js/game.js"></script>
</body>
</html>
