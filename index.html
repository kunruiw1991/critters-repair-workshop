<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Critter Repair 3D">
<meta name="theme-color" content="#2a2233">
<title>微笑小伙伴修理屋 3D</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="gl"></canvas>

<!-- Top bar -->
<header id="top">
  <div class="brand"><span class="logo">🧵</span><div><b>微笑小伙伴修理屋</b><small>给每个小伙伴暖暖的照顾</small></div></div>
  <div class="right">
    <div class="pill" id="starPill">⭐ <span id="stars">0</span></div>
    <button class="round" id="musicBtn" title="背景音乐">🎵</button>
    <button class="round" id="soundBtn" title="音效和语音">🔊</button>
    <button class="round hidden" id="pauseBtn" title="暂停">⏸</button>
    <button class="round hidden" id="stopBtn" title="返回选伙伴">⏹</button>
  </div>
</header>

<!-- Home -->
<section id="home" class="overlay">
  <div class="homecard glass">
    <h1>今天帮哪个小伙伴？</h1>
    <p>小伙伴们探险回来，身上脏脏的，缝线也松了。新增 <b>45cm 大长腿夜梦微笑伙伴</b> 与 <b>夜梦小动物团</b>，选一位朋友照顾它吧！</p>
    <div class="cat-tabs" id="catTabs">
      <button type="button" class="cat-tab sel" data-cat="all">✨ 全部伙伴 (27)</button>
      <button type="button" class="cat-tab" data-cat="nightmare_smiling">🌙 45cm大长腿夜梦微笑伙伴 (8)</button>
      <button type="button" class="cat-tab" data-cat="nightmare_critters">🦇 45cm夜梦小动物团 (8)</button>
      <button type="button" class="cat-tab" data-cat="classic">☀️ 经典微笑与家人 (11)</button>
    </div>
    <div class="patients" id="patients"></div>
    <div class="home-actions">
    <button class="cta" id="startBtn">▶ 开始修理</button>
    <button class="ghost voice-preview" id="voicePreviewBtn">🎀 试听中文声音</button>
    </div>
  </div>
</section>

<!-- In-game HUD -->
<aside id="ticket" class="glass hidden">
  <div class="tk-head"><img id="tkIcon" alt=""><div><b id="tkName"></b><small id="tkWho"></small></div></div>
  <div class="tk-title">修理小清单</div>
  <div id="chips"></div>
  <div class="heart-meter"><span>💗</span><div class="bar"><div id="heartFill"></div></div></div>
  <div class="tk-tip">点一点清单，就能找到要修的地方。</div>
</aside>

<div id="turn" class="hidden">
  <button class="round" id="rotL" title="向左转">⟲</button>
  <button class="round" id="zoomBtn" title="放大或缩小">🔍</button>
  <button class="round" id="rotR" title="向右转">⟳</button>
</div>

<nav id="toolbox" class="hidden"><div class="drawer" id="tools"></div></nav>

<nav id="dress" class="hidden">
  <div class="drawer">
    <div class="dress-title">选一份小礼物</div>
    <div class="row" id="dressItems"></div>
    <button class="cta small" id="shelfBtn">🏠 去快乐伙伴架</button>
  </div>
</nav>

<div id="bubble" class="hidden"></div>
<div id="cursor"></div>
<div id="toast" class="hidden"></div>

<section id="pauseVeil" class="overlay hidden"><div class="glass homecard small"><h1>休息一小会儿</h1><button class="cta" id="resumeBtn">▶ 继续玩</button></div></section>
<section id="endVeil" class="overlay hidden"></section>

<script src="js/vendor/three.min.js"></script>
<script type="module" src="js/game.js"></script>
</body>
</html>
